services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/devsoftechs/dev-portfolio:local
    container_name: dev-portfolio
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
